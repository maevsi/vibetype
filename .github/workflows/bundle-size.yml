name: Bundle Size

permissions: {}

on:
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@c5ce66f1d49540c35f76c4876e0eaa083bc27739 # 5.9.7
    permissions:
      pull-requests: read
  bundle-size:
    needs: ci-optimization
    # Two full Nuxt builds are the most expensive thing this repository runs per pull request, so they are skipped for changes that cannot move a byte of the client bundle, the same gate the rest of CI uses.
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Client bundle size
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 40
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          clean: false
          path: base

      # Corepack provides the `pnpm` binary that the dependency cache below keys on, so it has to be enabled before Node.js is set up.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            base/pnpm-lock.yaml
          node-version-file: .nvmrc

      - name: Install PR dependencies
        run: pnpm --dir src install

      - name: Measure PR bundle size
        run: ./tests/scripts/bundle-size/measure.sh /tmp/bundle_size_pr.json

      - name: Install base dependencies
        run: pnpm --dir base/src install

      # Uses the PR's own copy of the script (not `base/tests/scripts/bundle-size/measure.sh`, which
      # may not exist yet on the base branch) so both sides are measured identically.
      - name: Measure base bundle size
        run: ./tests/scripts/bundle-size/measure.sh /tmp/bundle_size_base.json base

      - name: Generate comparison
        run: |
          ./tests/scripts/bundle-size/compare.sh \
            /tmp/bundle_size_base.json \
            /tmp/bundle_size_pr.json \
            /tmp/bundle_size_comment.md \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat /tmp/bundle_size_comment.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork runs with a read-only `GITHUB_TOKEN` regardless of the permissions declared above, so commenting would fail the job on every external contribution.
      # Skipping the comment keeps those runs green, and the comparison is still readable in the job summary written above.
      - name: Find comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: fc
        with:
          body-includes: Bundle Size
          comment-author: 'github-actions[bot]'
          issue-number: ${{ github.event.pull_request.number }}

      - name: Post or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          body-path: /tmp/bundle_size_comment.md
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          issue-number: ${{ github.event.pull_request.number }}
