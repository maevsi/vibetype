name: Bundle Size

permissions: {}

on:
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@c5ce66f1d49540c35f76c4876e0eaa083bc27739 # 5.9.7
    permissions:
      pull-requests: read
  bundle-size:
    needs: ci-optimization
    # Two full Nuxt builds are the most expensive thing this repository runs per pull request, so they are skipped for changes that cannot move a byte of the client bundle, the same gate the rest of CI uses.
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Client bundle size
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 40
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          clean: false
          path: base

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Both sides are built through the `Dockerfile` so that the numbers describe the artifact that actually ships, instead of a separately configured build on the runner.
      #
      # `NUXT_ANALYZE` only adds the analysis plugins to the client build and leaves the emitted chunks untouched, so this is the same build a release runs and no second one is needed.
      # `RELEASE_NAME` is pinned to a constant so that neither side can pick up a branch-dependent release identifier.
      # `SENTRY_AUTH_TOKEN` is deliberately not passed: source map upload would only slow the build down, and a pull request from a fork could not provide it anyway.
      #
      # There is no BuildKit cache here on purpose. Only the dependency layers are ever reusable, the layer that installs them is invalidated by any source change, and a `mode=max` export of an image this size would evict the repository's entire 10 GB Actions cache within a few pull requests.
      #
      # The `.git` directory stays in the build context because Sentry's bundler plugin resolves the release name by running `git rev-parse HEAD` and injects the result into the client bundle.
      # The two sides therefore get different commit hashes, but both are 40 characters wide, so this cannot shift the comparison by a single byte.
      - name: Build PR report
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            NUXT_ANALYZE=1
            RELEASE_NAME=0.0.0-bundle-size
          context: .
          file: Dockerfile
          outputs: type=local,dest=/tmp/report-pr
          target: bundle-size

      # The base branch moves rarely compared to how often pull requests are pushed, and its report depends only on its commit, so caching it by that commit removes one of the two builds from almost every run.
      # The report is around 3 MB against a 10 GB budget, which is why this is worth caching even though the BuildKit layer cache is not.
      - name: Restore base report
        id: base-report-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: bundle-size-report-${{ github.event.pull_request.base.sha }}
          path: /tmp/report-base

      # The base branch's source tree is built with *this* branch's `Dockerfile`, so both sides are measured by identical tooling even when the base branch predates a change to it.
      # `file` is resolved against the workspace rather than against `context`, which is what makes that possible.
      #
      # That portability does not extend to `src/nuxt.config.ts`, which comes from the base tree and is where `NUXT_ANALYZE` is read.
      # A base branch without that flag therefore produces no report, which is a property of the base branch and not a fault in the pull request, so the failure is tolerated here and reported as a comment rather than failing the check.
      - name: Build base report
        id: base-report-build
        if: steps.base-report-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            NUXT_ANALYZE=1
            RELEASE_NAME=0.0.0-bundle-size
          context: base
          file: Dockerfile
          outputs: type=local,dest=/tmp/report-base
          target: bundle-size

      - name: Check whether the base branch could be measured
        id: base-report
        run: |
          if [ -f /tmp/report-base/client.html ]; then
            echo 'measured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'measured=false' >> "$GITHUB_OUTPUT"
          fi

      # `extract-chunks.mjs` imports nothing but `node:fs`, so running it needs no dependency installation.
      # Running it on the runner rather than inside the image is what keeps both reports on one version of the extraction logic.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Generate comparison
        run: |
          if [ '${{ steps.base-report.outputs.measured }}' = 'true' ]; then
            node ./tests/scripts/bundle-size/extract-chunks.mjs /tmp/report-pr/client.html /tmp/bundle_size_pr.json
            node ./tests/scripts/bundle-size/extract-chunks.mjs /tmp/report-base/client.html /tmp/bundle_size_base.json
            ./tests/scripts/bundle-size/compare.sh \
              /tmp/bundle_size_base.json \
              /tmp/bundle_size_pr.json \
              /tmp/bundle_size_comment.md \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            {
              printf '## Bundle Size\n\n'
              printf ':information_source: The base branch could not be measured, so there is nothing to compare against.\n\n'
              printf 'This happens when `%s` does not yet read `NUXT_ANALYZE` in `src/nuxt.config.ts`, and resolves once that lands there.\n' '${{ github.event.pull_request.base.ref }}'
            } > /tmp/bundle_size_comment.md
          fi
          cat /tmp/bundle_size_comment.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork runs with a read-only `GITHUB_TOKEN` regardless of the permissions declared above, so commenting would fail the job on every external contribution.
      # Skipping the comment keeps those runs green, and the comparison is still readable in the job summary written above.
      - name: Find comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: fc
        with:
          body-includes: Bundle Size
          comment-author: 'github-actions[bot]'
          issue-number: ${{ github.event.pull_request.number }}

      - name: Post or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          body-path: /tmp/bundle_size_comment.md
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          issue-number: ${{ github.event.pull_request.number }}
