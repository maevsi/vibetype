name: GHCR Cleanup

permissions: {}

on:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 01:00 AM UTC
  workflow_dispatch:
    inputs:
      DRY_RUN:
        default: true
        type: boolean

jobs:
  ghcr-cleanup:
    name: GHCR cleanup
    uses: dargmuesli/github-actions/.github/workflows/ghcr-cleanup.yml@ec1208db30dfa20f05c0d273ae10772bd3184e0c # 6.0.0-beta.4
    permissions:
      packages: write
    with:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.DRY_RUN }}
