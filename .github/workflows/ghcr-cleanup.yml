name: GHCR Cleanup

permissions: {}

on:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 01:00 AM UTC
  workflow_dispatch:
    inputs:
      DRY_RUN:
        default: true
        type: boolean

jobs:
  ghcr-cleanup:
    name: GHCR cleanup
    uses: dargmuesli/github-actions/.github/workflows/ghcr-cleanup.yml@66040b4567381bad6e0b9a68caa17643e1d365bd # 5.10.0
    permissions:
      packages: write
    with:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.DRY_RUN }}
