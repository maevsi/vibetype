name: GHCR Cleanup

permissions: {}

on:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 01:00 AM UTC
  workflow_dispatch:
    inputs:
      DRY_RUN:
        default: true
        type: boolean

jobs:
  ghcr-cleanup:
    name: GHCR cleanup
    uses: dargmuesli/github-actions/.github/workflows/ghcr-cleanup.yml@8497f7813a3e47dccc95d68ca148d75a1a852e34 # 6.0.0-beta.6
    permissions:
      packages: write
    with:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.DRY_RUN }}
