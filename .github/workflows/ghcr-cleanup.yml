name: GHCR Cleanup

permissions: {}

on:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 01:00 AM UTC
  workflow_dispatch:
    inputs:
      DRY_RUN:
        default: true
        type: boolean

jobs:
  ghcr-cleanup:
    name: GHCR cleanup
    uses: dargmuesli/github-actions/.github/workflows/ghcr-cleanup.yml@b5df3092b16390e86bd778060c38d11ee8ac738e # 6.0.0-beta.5
    permissions:
      packages: write
    with:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.DRY_RUN }}
