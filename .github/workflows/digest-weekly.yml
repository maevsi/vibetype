name: "Digest: Weekly"

permissions: {}

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 in Germany on the default branch, early because scheduled runs start hours late
      timezone: Europe/Berlin
  workflow_dispatch:

jobs:
  digest-weekly:
    name: "Digest: Weekly"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      # A manual run this week already posted the digest, and a schedule is never deduplicated against it.
      - name: Check for a digest posted this week
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TZ=Europe/Berlin
          monday=$(date -d "$(date -d "$(( $(date +%u) - 1 )) days ago" +%F)" -Iseconds)
          posted=$(gh run list -R "$GITHUB_REPOSITORY" -w digest-weekly.yml -s success --created ">=$monday" --json databaseId -q length)
          echo "skip=$([ "$posted" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Collect merged pull requests
        id: collect
        if: steps.guard.outputs.skip != 'true'
        env:
          # Optional fine-grained token to include private repositories.
          GH_TOKEN: ${{ secrets.DIGEST_GH_TOKEN || github.token }}
        run: |
          .github/weekly-digest.sh collect > "$RUNNER_TEMP/context.json"
          echo "total=$(jq .counts.total "$RUNNER_TEMP/context.json")" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: steps.collect.outputs.total > 0
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        # The summary is never printed: run logs of this public repository are public,
        # and with DIGEST_GH_TOKEN it describes private repositories.
        run: .github/weekly-digest.sh summarize < "$RUNNER_TEMP/context.json" > "$RUNNER_TEMP/summary.md"

      - name: Post to Discord
        if: steps.collect.outputs.total > 0
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: .github/weekly-digest.sh post "$RUNNER_TEMP/context.json" "$RUNNER_TEMP/summary.md"
